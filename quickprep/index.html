<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickPrep - Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="theme-buttons">
    <button id="light-mode">☀️ Light</button>
    <button id="dark-mode">🌙 Dark</button>
  </div>
  <nav class="nav-links">
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="location.href='recipes.html'">Recipes</button>
    <button onclick="location.href='contact.html'">Contact Us</button>
  </nav>
</header>


  <main>
    <section class="intro">
      <img src="logo.png" alt="QuickPrep Logo" class="logo" />
      <h1>Cook Smart, Eat Healthy</h1>
    </section>

    <section class="recipe-of-day">
      <h2>Recipe of the Day</h2>
      <div class="recipe-box">
        <div class="recipe-left">
          <h3>Avocado Toast</h3>
          <p>⭐⭐⭐⭐☆</p>
        </div>
        <div class="recipe-center">
          <img src="avocado-toast.jpg" alt="Avocado Toast" />
        </div>
        <div class="recipe-right">
          <a href="recipes.html#avocado-toast">View Recipe →</a>
        </div>
      </div>
    </section>

    <section class="search-section">
      <p>Looking for something specific?</p>
      <input type="text" placeholder="Search recipes..." />
    </section>
  </main>

  <script>
    const toggle = document.getElementById('theme-toggle')
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark')
    })
  </script>
  <script src="script.js"></script>
  <script src="recipies.js"></script>
  <script src="randomRecipie.js"></script>

</body>
</html>
